name: Hooks docs drift

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  hook-events:
    name: Hook Events match the hooks reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Compare the documented Hook Events with the enum
        run: php bin/check-hook-events
